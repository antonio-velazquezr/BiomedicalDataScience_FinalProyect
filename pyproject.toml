[project]
name = "antitromboticos"
version = "0.1.0"
description = "Anticoagulante + antiagregante en el hospital: cohorte y desenlaces en MIMIC-IV"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0",
    "polars>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "jupyter", "nbconvert"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
